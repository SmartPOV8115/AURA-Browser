<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient"></div>

  <div class="window">
    <aside id="sidebar" class="sidebar">
      <div class="top-controls">
        <button id="collapseBtn" title="Collapse sidebar">☰</button>
        <button id="homeBtn" title="Dashboard">◉</button>
        <div class="spacer"></div>
        <button id="settingsBtn" title="Settings">⚙</button>
        <button id="minBtn" title="Minimize">—</button>
        <button id="closeBtn" title="Close">×</button>
      </div>

      <div class="address-row">
        <button id="backBtn" title="Back">‹</button>
        <button id="forwardBtn" title="Forward">›</button>
        <button id="reloadBtn" title="Reload">↻</button>
      </div>

      <div class="omnibox">
        <span>⌕</span>
        <input id="urlInput" value="" spellcheck="false" placeholder="Search or enter URL">
      </div>

      <div class="shortcut-head">
        <span>SHORTCUTS</span>
        <div class="head-actions">
          <button id="pinCurrentBtn" title="Pin current page">☆</button>
          <button id="addShortcutBtn" title="Add shortcut">＋</button>
        </div>
      </div>
      <div id="quickGrid" class="quick-grid"></div>

      <div class="section-label"><span class="dot"></span> WORKSPACE</div>
      <div id="workspaceList" class="workspace-list"></div>

      <div class="sidebar-bottom">
        <button id="newWorkspace">＋ New Workspace</button>
        <button id="commandBtn">⌘ Command</button>
      </div>
    </aside>

    <main class="content">
      <div class="titlebar">
        <div id="tabs" class="tabs"></div>
        <div class="title-actions">
          <button id="newTab" title="New tab">＋</button>
          <button id="homeDash" title="Dashboard">⌂</button>
        </div>
      </div>

      <section id="dashboard" class="dashboard">
        <div class="hero">
          <div class="eyebrow">AURA // LOCAL INTERFACE</div>
          <h1 id="greeting">Good Evening</h1>
          <p>Clear skies. Your workspace is ready.</p>
          <div class="weather">☁ <strong>24°</strong><span> Bengaluru</span></div>
        </div>

        <div class="dashboard-grid">
          <div class="card">
            <span class="card-label">WORKSPACE</span>
            <strong id="dashWorkspace">Monkeytype</strong>
            <small id="dashShortcutCount">0 shortcuts</small>
          </div>
          <div class="card">
            <span class="card-label">SYSTEM</span>
            <strong>ONLINE</strong>
            <small id="systemState">AURA browser shell operational</small>
          </div>
          <div class="card command-card" id="dashCommand">
            <span class="card-label">AURA</span>
            <strong>What are we doing?</strong>
            <small>Press Ctrl + Space</small>
          </div>
        </div>
      </section>

      <div id="webviews" class="webviews"></div>
    </main>
  </div>

  <div id="commandPalette" class="overlay hidden">
    <div class="palette">
      <div class="palette-title">◉ AURA COMMAND</div>
      <input id="commandInput" placeholder="Search a command or website" autofocus>
      <div id="commandResults" class="commands"></div>
    </div>
  </div>

  <div id="shortcutModal" class="overlay hidden">
    <div class="dialog">
      <div class="palette-title">＋ ADD SHORTCUT</div>
      <label>Name<input id="shortcutName" placeholder="GitHub"></label>
      <label>URL<input id="shortcutUrl" placeholder="https://github.com"></label>
      <div class="dialog-actions">
        <button id="cancelShortcut">Cancel</button>
        <button id="saveShortcut" class="primary">Add shortcut</button>
      </div>
    </div>
  </div>

  <div id="workspaceModal" class="overlay hidden">
    <div class="dialog">
      <div class="palette-title">◉ WORKSPACE</div>
      <label>Name<input id="workspaceName" placeholder="Study"></label>
      <div class="dialog-actions">
        <button id="cancelWorkspace">Cancel</button>
        <button id="saveWorkspace" class="primary">Create</button>
      </div>
    </div>
  </div>

  <div id="contextMenu" class="context-menu hidden"></div>

  <script src="renderer.js"></script>
</body>
</html>
